name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild so Debian, CPython and pip security fixes reach the published
  # image even when nobody pushes. Mondays 04:17 UTC, off the top of the hour.
  schedule:
    - cron: "17 4 * * 1"

# A newer push makes an in-flight run pointless; don't pay for both. Scheduled
# runs share the group on purpose: both build main's head, so whichever wins
# loses nothing, and an older build can never land `latest` after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile. 3.13 has no stdlib `audioop`; discord.py
          # installs `audioop-lts` in its place, so tests must run on 3.13 too.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No token, no network, no ffmpeg needed: the suite covers pure logic
        # plus loading every cog and building the slash-command tree offline.
        run: python -m unittest discover -s tests -t . -v

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    # Only publish from main. Pull requests get the test job as a gate and
    # nothing else — a fork's token cannot write packages anyway.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # GHCR rejects uppercase names and this repo's owner has some;
          # metadata-action lowercases the image reference for us.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always fetch the current python:3.13-slim-bookworm rather than a
          # stale local copy of the tag.
          pull: true
          # Scheduled and manual runs exist to pick up security fixes, which the
          # cache would hide: the apt and pip layers never change on their own.
          # They still write the cache, so the next push starts from fresh layers.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # apt-get and pip dominate the build; caching them turns a ~2 minute
          # rebuild into seconds when only bot/ changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
