name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run pointless; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. 3.13 removed `audioop`, which discord.py's
          # voice path needs, so the version is not incidental.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No token, no network, no ffmpeg needed: the suite covers pure logic
        # plus loading every cog and building the slash-command tree offline.
        run: python -m unittest discover -s tests -t . -v

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    # Only publish from main. Pull requests get the test job as a gate and
    # nothing else — a fork's token cannot write packages anyway.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR rejects uppercase names and this repo's owner has some;
          # metadata-action lowercases the image reference for us.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # apt-get and pip dominate the build; caching them turns a ~2 minute
          # rebuild into seconds when only bot/ changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
