# Compose file for a Docker management UI (Arcane, Portainer, Dockge, Komodo…).
#
# Differences from docker-compose.yml, all because a UI deploys a compose file
# without the source tree next to it and from a working directory you don't
# control:
#
#   * No `build:` — a pasted stack has no Dockerfile or bot/ directory to build
#     from, so the image comes from GitHub Actions (see BOT_IMAGE below) or from
#     a one-off `docker build` on the host.
#   * Named volumes rather than bind mounts. A relative path like ./data would
#     resolve against the manager's own project directory, which is a path
#     inside *its* container and not somewhere the Docker daemon can bind. Named
#     volumes need no host directory, no chown, and no PUID/PGID at all: Docker
#     creates them owned by the image's user.
#   * Settings live under `environment:` rather than in a .env file, so they show
#     up in the UI's variable editor.
#
# Two ways to get the image:
#
#   A. Published by CI (recommended) — every push to main builds it. Set:
#        BOT_IMAGE=ghcr.io/itzlcky/meatload:latest
#        PULL_POLICY=always
#
#   B. Built by hand on the Docker host:
#        cd /path/to/meatload && docker build -t discord-bot:latest .
#      The defaults below already match this.

services:
  bot:
    image: ${BOT_IMAGE:-discord-bot:latest}
    container_name: discord-bot
    restart: unless-stopped

    # `never` suits a locally-built image that was never pushed anywhere: it
    # stops an auto-updating manager from trying to pull it and failing. Switch
    # to `always` alongside a registry BOT_IMAGE so updates actually arrive.
    pull_policy: ${PULL_POLICY:-never}

    # No `user:` override on purpose. The image already runs as its own
    # unprivileged user, and Docker initialises a fresh named volume with that
    # same ownership, so the bot can write its database with nothing to
    # configure. Overriding the user here is what makes a bind mount need a
    # matching chown on the host.

    volumes:
      - bot-data:/app/data
      # Optional: only used if you set YTDLP_COOKIES_FILE below.
      - bot-cookies:/app/cookies

    environment:
      # ── Required ──────────────────────────────────────────────────────────
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in the stack environment}

      # ── Core ──────────────────────────────────────────────────────────────
      # Your server's ID. Slash commands appear instantly instead of taking an
      # hour. Right-click the server -> Copy Server ID (needs Developer Mode).
      DEV_GUILD_IDS: ${DEV_GUILD_IDS:-}
      OWNER_IDS: ${OWNER_IDS:-}
      DEFAULT_PREFIX: ${DEFAULT_PREFIX:-!}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_PATH: /app/data/bot.db
      ACTIVITY_NAME: ${ACTIVITY_NAME:-music with friends}
      ACTIVITY_TYPE: ${ACTIVITY_TYPE:-listening}

      # ── Music ─────────────────────────────────────────────────────────────
      # Pulls the newest yt-dlp on every start; a restart fixes most YouTube
      # breakage without rebuilding the image.
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-true}
      MUSIC_IDLE_TIMEOUT: ${MUSIC_IDLE_TIMEOUT:-300}
      MUSIC_ALONE_TIMEOUT: ${MUSIC_ALONE_TIMEOUT:-60}
      MUSIC_DEFAULT_VOLUME: ${MUSIC_DEFAULT_VOLUME:-50}
      MUSIC_MAX_QUEUE: ${MUSIC_MAX_QUEUE:-500}
      MUSIC_MAX_PLAYLIST: ${MUSIC_MAX_PLAYLIST:-200}
      # Set to /app/cookies/cookies.txt if YouTube starts asking the bot to
      # confirm it isn't a bot. Copy the file in with:
      #   docker cp cookies.txt discord-bot:/app/cookies/cookies.txt
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      YTDLP_EXTRACTOR_ARGS: ${YTDLP_EXTRACTOR_ARGS:-}

      # ── Optional: lets the bot resolve Spotify links ──────────────────────
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}

    # No inbound ports: the bot only makes outbound connections to Discord.
    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if os.path.exists('/app/data/heartbeat') and time.time()-os.path.getmtime('/app/data/heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      # The bot has to log in to Discord before it writes its first heartbeat,
      # so give it room. Health stays "starting", not "unhealthy", until this
      # elapses.
      start_period: 90s
      retries: 3

volumes:
  bot-data:
  bot-cookies:
