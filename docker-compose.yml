services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-bot:latest
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    # Run as the host user that owns ./data, so the bind-mounted database is
    # writable. Defaults suit a single-user desktop; override PUID/PGID in .env
    # if `id -u` / `id -g` say otherwise.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # SQLite database + anything else the bot persists.
      - ./data:/app/data
      # Optional: drop a Netscape-format cookies.txt here if YouTube starts
      # asking the bot to "sign in to confirm you're not a bot".
      - ./cookies:/app/cookies:ro
    # The container has no inbound ports: Discord connections are outbound only.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # The bot touches this file once it is connected and ready, and refreshes
      # it every 30s. If the heartbeat goes stale, Docker marks it unhealthy.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if os.path.exists('/app/data/heartbeat') and time.time()-os.path.getmtime('/app/data/heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
